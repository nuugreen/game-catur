
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NUGREEN 3D Chess</title>
<style>
:root{--gold:#e4b347;--bg:#090d14;--panel:#141b26;--text:#edf1f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;overflow:hidden}
#app{display:flex;height:100dvh}
#game{flex:1;min-width:0;position:relative}
canvas{display:block}
#sidebar{width:300px;max-width:38vw;overflow:auto;padding:17px;background:#121924;border-left:1px solid #344052}
.brand{font-size:22px;font-weight:900;letter-spacing:4px;color:var(--gold)}
.subtitle{font-size:10px;letter-spacing:3px;color:#8c9aae;margin:5px 0 18px}
.status{padding:12px;background:#202a39;border:1px solid #39475b;border-radius:8px;font-size:13px;line-height:1.5;margin:10px 0}
label,.section-title{display:block;font-size:11px;letter-spacing:1px;color:#aeb9c9;margin:13px 0 7px}
.section-title{color:var(--gold);letter-spacing:2px}
button,select{width:100%;padding:10px;border-radius:7px;border:1px solid #39475b;background:#202a39;color:white;cursor:pointer}
button:hover{border-color:var(--gold);color:var(--gold)}
.primary{background:#c69a43;color:#10141a;font-weight:bold;border-color:#f0cb72}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
#history{background:#0b1119;padding:9px;border-radius:7px;max-height:190px;overflow:auto;font:12px/1.8 monospace;color:#c5cedb;min-height:55px}
.move{display:grid;grid-template-columns:28px 1fr 1fr;gap:4px}
.move span:first-child{color:#75849a}
#topStatus{position:absolute;top:12px;left:12px;background:#090d14d9;border:1px solid #354052;padding:9px 12px;border-radius:7px;font-size:12px;pointer-events:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#090d14;z-index:10;color:var(--gold);letter-spacing:3px;font-weight:bold}
.hint{font-size:11px;color:#8997aa;line-height:1.6;margin-top:16px}
a{color:var(--gold)}
@media(max-width:700px){
 #app{flex-direction:column}
 #game{flex:1;min-height:0}
 #sidebar{width:100%;max-width:none;height:245px;border:0;border-top:1px solid #344052;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
 .brand{font-size:17px}.subtitle{margin-bottom:5px}
 .status{margin:5px 0;padding:7px}
 label,.section-title{margin:6px 0}
 #history{max-height:68px}
 .hint{display:none}
 .wide{grid-column:1/-1}
}
</style>
</head>
<body>
<div id="app">
  <main id="game">
    <div id="loading">NUGREEN CHESS · MEMUAT...</div>
    <div id="topStatus">Memulai permainan...</div>
  </main>
  <aside id="sidebar">
    <div class="wide">
      <div class="brand">NUGREEN</div>
      <div class="subtitle">3D CHESS ARENA</div>
    </div>
    <div id="status" class="status wide">Giliran kamu · Putih (emas)</div>
    <div>
      <label for="difficulty">TINGKAT KESULITAN AI</label>
      <select id="difficulty">
        <option value="1">Pemula</option>
        <option value="2" selected>Menengah</option>
        <option value="3">Sulit</option>
      </select>
    </div>
    <div>
      <label>PERMAINAN</label>
      <button id="newGame" class="primary">＋ Permainan Baru</button>
    </div>
    <div class="buttons wide">
      <button id="undo">↶ Undo</button>
      <button id="resetCamera">◎ Reset Kamera</button>
      <button id="rotateBoard">⟳ Putar Papan</button>
      <button id="clearSelection">Hapus Pilihan</button>
    </div>
    <div class="wide">
      <div class="section-title">RIWAYAT LANGKAH</div>
      <div id="history">Belum ada langkah.</div>
    </div>
    <div class="hint wide">
      Klik bidak emas, lalu pilih kotak tujuan yang tersedia. Geser mouse untuk memutar kamera dan gunakan scroll untuk zoom.
      <br><br><a href="https://github.com/nuugreen/game-catur/blob/main/README.md" target="_blank" rel="noopener">Panduan permainan ↗</a>
    </div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
(() => {
'use strict';

const host=document.getElementById('game');
const statusEl=document.getElementById('status');
const topStatus=document.getElementById('topStatus');
const historyEl=document.getElementById('history');
const loadingEl=document.getElementById('loading');

if(!window.THREE||!window.Chess){
  loadingEl.textContent='GAGAL MEMUAT. PERIKSA KONEKSI INTERNET.';
  return;
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x090d14);
scene.fog=new THREE.Fog(0x090d14,18,36);

const camera=new THREE.PerspectiveCamera(43,1,0.1,100);
camera.position.set(7.8,9.7,10.2);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(host.clientWidth,host.clientHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.82;
host.appendChild(renderer.domElement);

const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.25,0);
controls.enableDamping=true;
controls.dampingFactor=0.07;
controls.maxPolarAngle=Math.PI/2.02;
controls.minDistance=7;
controls.maxDistance=19;

scene.add(new THREE.HemisphereLight(0xe8edff,0x30303a,1.25));
const keyLight=new THREE.DirectionalLight(0xffe5b0,2.5);
keyLight.position.set(-5,12,7);
keyLight.castShadow=true;
keyLight.shadow.mapSize.set(2048,2048);
keyLight.shadow.camera.left=-9;
keyLight.shadow.camera.right=9;
keyLight.shadow.camera.top=9;
keyLight.shadow.camera.bottom=-9;
keyLight.shadow.bias=-0.0004;
scene.add(keyLight);
const fillLight=new THREE.DirectionalLight(0x9bbdff,1.1);
fillLight.position.set(7,6,-8);
scene.add(fillLight);
const rimLight=new THREE.PointLight(0xffc65a,0.8,25);
rimLight.position.set(0,5,0);
scene.add(rimLight);

const goldMat=new THREE.MeshStandardMaterial({color:0xe4b347,metalness:0.82,roughness:0.23});
const goldLight=new THREE.MeshStandardMaterial({color:0xffd978,metalness:0.72,roughness:0.2});
const blackMat=new THREE.MeshStandardMaterial({color:0x242a34,metalness:0.94,roughness:0.2});
const blackLight=new THREE.MeshStandardMaterial({color:0x667181,metalness:0.86,roughness:0.23});
const trimMat=new THREE.MeshStandardMaterial({color:0x121722,metalness:0.76,roughness:0.3});
const tileLight=new THREE.MeshStandardMaterial({color:0xc8bda5,roughness:0.68});
const tileDark=new THREE.MeshStandardMaterial({color:0x303b4a,roughness:0.55,metalness:0.12});
const moveDotMat=new THREE.MeshBasicMaterial({color:0x5ee0b9,transparent:true,opacity:0.8});

const chess=new Chess();
const boardRoot=new THREE.Group();
scene.add(boardRoot);

const squareMeshes=new Map();
const pieceMeshes=new Map();
const haloMeshes=[];
const animations=[];
const effects=[];
let selected=null,targets=[],busy=false,flipped=false,aiTimer=null;
let checkmateSprite=null;

function addMesh(geo,mat,parent,x=0,y=0,z=0){
  const o=new THREE.Mesh(geo,mat);
  o.position.set(x,y,z);
  o.castShadow=true;
  o.receiveShadow=true;
  parent.add(o);
  return o;
}
function box(parent,w,h,d,mat,x,y,z){
  return addMesh(new THREE.BoxGeometry(w,h,d),mat,parent,x,y,z);
}
function sphere(parent,r,mat,x,y,z,seg=32){
  return addMesh(new THREE.SphereGeometry(r,seg,Math.max(12,Math.floor(seg*.7))),mat,parent,x,y,z);
}
function cylinder(parent,rt,rb,h,mat,x,y,z,seg=32){
  return addMesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat,parent,x,y,z);
}
function lathe(parent,points,mat,x=0,y=0,z=0){
  return addMesh(new THREE.LatheGeometry(points.map(p=>new THREE.Vector2(p[0],p[1])),64),mat,parent,x,y,z);
}
function base(group,mat){
  cylinder(group,.37,.43,.12,mat,0,.08,0,48);
  cylinder(group,.32,.37,.09,trimMat,0,.17,0,48);
  cylinder(group,.28,.31,.12,mat,0,.25,0,48);
}
function makeBoard(){
  addMesh(new THREE.BoxGeometry(200,.2,200),
    new THREE.MeshStandardMaterial({color:0x0c111a,roughness:.88}),scene,0,-.24,0);
  box(boardRoot,8.55,.32,8.55,trimMat,0,-.04,0);
  box(boardRoot,8.3,.09,8.3,goldMat,0,.12,0);
  box(boardRoot,8.15,.1,8.15,trimMat,0,.19,0);

  for(let r=0;r<8;r++)for(let f=0;f<8;f++){
    const sq=String.fromCharCode(97+f)+(r+1);
    const tile=box(boardRoot,1,.12,1,(r+f)%2===0?tileLight:tileDark,f-3.5,.28,3.5-r);
    tile.userData.square=sq;
    squareMeshes.set(sq,tile);
  }
  for(const side of [-1,1]){
    box(boardRoot,8.45,.035,.035,goldLight,0,.3,side*4.19);
    box(boardRoot,.035,.035,8.45,goldLight,side*4.19,.3,0);
  }
}

/* Model patung manusia: kepala, badan, lengan, kaki dan zirah. */
function humanFigure(group,mat,accent,role){
  base(group,mat);

  for(const side of [-1,1]){
    const x=side*.105;
    const leg=cylinder(group,.065,.085,.32,mat,x,.43,0,32);
    leg.rotation.z=side*.035;
    sphere(group,.09,accent,x,.28,.06,24).scale.set(1,.55,1.3);
  }

  cylinder(group,.15,.2,.15,accent,0,.63,0,40);
  const torso=sphere(group,role==='queen'?.21:.24,mat,0,.82,0,48);
  torso.scale.set(role==='queen'?.82:1,1.12,.73);

  // Bahu, lengan, siku, dan tangan.
  for(const side of [-1,1]){
    sphere(group,.105,accent,side*.22,.94,0,28);
    const arm=cylinder(group,.05,.075,.31,mat,side*.25,.77,.015,28);
    arm.rotation.z=-side*.2;
    sphere(group,.06,accent,side*.28,.60,.045,24);
  }

  cylinder(group,.075,.085,.12,accent,0,1.03,0,32);
  sphere(group,.155,mat,0,1.18,0,48);
  sphere(group,.085,accent,0,1.18,.105,32).scale.set(.85,.8,.35);
  sphere(group,.014,trimMat,-.038,1.2,.137,12);
  sphere(group,.014,trimMat,.038,1.2,.137,12);

  if(role==='pawn'){
    addMesh(new THREE.SphereGeometry(.16,32,24,0,Math.PI*2,0,Math.PI*.55),
      accent,group,0,1.25,0);
    // Perisai, tanpa tombak.
    const shield=new THREE.Group();
    shield.position.set(-.22,.73,.17);
    group.add(shield);
    const s=new THREE.Shape();
    s.moveTo(0,.15);s.lineTo(.12,.08);s.lineTo(.1,-.1);
    s.lineTo(0,-.2);s.lineTo(-.1,-.1);s.lineTo(-.12,.08);s.closePath();
    addMesh(new THREE.ShapeGeometry(s,16),accent,shield);
    box(shield,.025,.16,.012,mat,0,0,.015);
  }

  if(role==='rook'){
    cylinder(group,.18,.15,.09,accent,0,1.34,0,40);
    box(group,.24,.09,.24,mat,0,1.42,0);
    for(const x of [-.08,.08])for(const z of [-.08,.08])
      box(group,.07,.08,.07,accent,x,1.5,z);
  }

  if(role==='bishop'){
    addMesh(new THREE.ConeGeometry(.18,.28,40),accent,group,0,1.36,0);
    sphere(group,.035,mat,0,1.45,.11,20);
    const sash=box(group,.055,.36,.035,accent,0,.82,.17);
    sash.rotation.z=-.35;
  }

  if(role==='queen'){
    cylinder(group,.2,.17,.07,accent,0,1.34,0,48);
    for(let i=0;i<7;i++){
      const a=i*Math.PI*2/7;
      sphere(group,.045,accent,Math.cos(a)*.16,1.41,Math.sin(a)*.16,20);
    }
    cylinder(group,.025,.025,.16,accent,0,1.49,0,24);
    box(group,.15,.035,.035,accent,0,1.52,0);
  }

  if(role==='king'){
    cylinder(group,.2,.17,.08,accent,0,1.34,0,48);
    cylinder(group,.025,.025,.19,accent,0,1.48,0,24);
    box(group,.15,.035,.035,accent,0,1.52,0);

    const halo=new THREE.Group();
    halo.position.set(0,1.77,0);
    group.add(halo);
    const ring=addMesh(new THREE.TorusGeometry(.28,.028,16,80),
      new THREE.MeshStandardMaterial({color:0xffdc77,emissive:0x8a5c11,
        emissiveIntensity:.7,metalness:.7,roughness:.18}),halo);
    ring.rotation.x=Math.PI/2;
    haloMeshes.push(halo);
  }
}

function makeHorse(group,mat,accent){
  const horse=new THREE.Group();
  horse.position.y=.1;
  group.add(horse);

  const body=sphere(horse,.28,mat,0,.68,0,48);
  body.scale.set(1.28,.78,1.65);

  const neck=cylinder(horse,.115,.18,.53,mat,0,.99,.43,36);
  neck.rotation.x=-.35;neck.rotation.z=-.22;

  const head=sphere(horse,.17,mat,0,1.26,.63,40);
  head.scale.set(.78,1.18,.88);
  sphere(horse,.105,accent,0,1.19,.77,32).scale.set(.95,.65,1.05);

  for(const x of [-.09,.09]){
    const ear=addMesh(new THREE.ConeGeometry(.055,.19,24),mat,horse,x,1.45,.59);
    ear.rotation.x=-.12;
  }
  for(const x of [-.13,.13])sphere(horse,.027,trimMat,x,1.3,.71,16);

  const tail=cylinder(horse,.035,.065,.35,mat,0,.73,-.49,24);
  tail.rotation.x=-.55;tail.rotation.z=.2;
  sphere(horse,.07,accent,0,.54,-.64,24);

  for(const p of [[-.17,.42,.4],[.17,.42,.4],[-.17,.42,-.4],[.17,.42,-.4]]){
    cylinder(horse,.055,.075,.36,mat,p[0],p[1],p[2],28);
    cylinder(horse,.085,.09,.07,accent,p[0],.23,p[2]+.025,24);
    sphere(horse,.07,mat,p[0],.19,p[2]+.025,24);
  }

  // Pelana.
  sphere(horse,.2,accent,0,.88,-.02,40).scale.set(1.15,.24,1.05);
  cylinder(horse,.18,.18,.045,trimMat,0,.83,-.02,32);

  // Penunggang dengan zirah dan helm.
  const rider=new THREE.Group();
  rider.position.set(0,1.01,-.03);
  horse.add(rider);
  sphere(rider,.16,accent,0,.16,0,40).scale.set(.9,1.28,.76);
  cylinder(rider,.13,.16,.1,trimMat,0,.02,0,32);
  sphere(rider,.105,mat,0,.39,0,32);
  addMesh(new THREE.ConeGeometry(.12,.17,32),accent,rider,0,.53,0);
  cylinder(rider,.11,.11,.035,mat,0,.47,0,32);

  for(const side of [-1,1]){
    const arm=cylinder(rider,.04,.055,.23,accent,side*.15,.19,.01,24);
    arm.rotation.z=side*.5;
    sphere(rider,.045,mat,side*.22,.28,.04,20);
  }
  sphere(rider,.09,mat,-.22,.19,.08,28).scale.set(.85,1.2,.35);
  const sword=cylinder(rider,.012,.018,.31,accent,.23,.37,.04,16);
  sword.rotation.z=-.45;
}

function makePiece(type,color){
  const group=new THREE.Group();
  const mat=color==='w'?goldMat:blackMat;
  const accent=color==='w'?goldLight:blackLight;

  if(type==='n')makeHorse(group,mat,accent);
  else humanFigure(group,mat,accent,
    ({p:'pawn',r:'rook',b:'bishop',q:'queen',k:'king'})[type]);

  group.scale.setScalar(.82);
  group.userData.type=type;
  group.userData.color=color;
  return group;
}

function squarePos(sq){
  let f=sq.charCodeAt(0)-97,r=Number(sq[1])-1;
  if(flipped){f=7-f;r=7-r;}
  return new THREE.Vector3(f-3.5,.18,3.5-r);
}

function clearEffects(){
  for(const e of effects){
    scene.remove(e);
    if(e.material&&e.material.dispose)e.material.dispose();
  }
  effects.length=0;
}

function makePieceMap(){
  for(const p of pieceMeshes.values())boardRoot.remove(p);
  pieceMeshes.clear();
  haloMeshes.length=0;
  for(const row of chess.board()){
    for(const p of row){
      if(!p)continue;
      const sq=String.fromCharCode(97+chess.board().flat().indexOf(p)); 
      // Posisi dibuat dari koordinat board di bawah agar bidak yang identik tidak tertukar.
    }
  }
  const board=chess.board();
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){
    const p=board[r][f];
    if(!p)continue;
    const sq=String.fromCharCode(97+f)+(8-r);
    const obj=makePiece(p.type,p.color);
    obj.position.copy(squarePos(sq));
    obj.userData.square=sq;
    boardRoot.add(obj);
    pieceMeshes.set(sq,obj);
  }
  updateCheckmateIcon();
}

function clearMarkers(){
  for(const m of boardRoot.children.filter(o=>o.userData.marker))boardRoot.remove(m);
}
function markSquare(sq,mat,size=.9){
  const p=squarePos(sq);
  const m=box(boardRoot,size,.018,size,mat,p.x,.36,p.z);
  m.userData.marker=true;
}
function showSelection(){
  clearMarkers();
  if(selected)markSquare(selected,new THREE.MeshBasicMaterial({color:0xffdf75,transparent:true,opacity:.55}));
  targets.forEach(sq=>{
    const p=squarePos(sq);
    const m=addMesh(new THREE.CylinderGeometry(.12,.12,.025,24),moveDotMat,boardRoot,p.x,.38,p.z);
    m.userData.marker=true;
  });
}
function showLastMove(from,to){
  clearMarkers();
  [from,to].forEach(sq=>markSquare(sq,
    new THREE.MeshBasicMaterial({color:0xd9b44a,transparent:true,opacity:.28}),.95));
}

function captureEffect(pos,color){
  for(let i=0;i<24;i++){
    const mat=new THREE.MeshStandardMaterial({color,metalness:.6,roughness:.25,emissive:color,emissiveIntensity:.25});
    const p=addMesh(new THREE.TetrahedronGeometry(.045+Math.random()*.055,0),mat,scene,pos.x,pos.y+.5,pos.z);
    p.userData.velocity=new THREE.Vector3((Math.random()-.5)*3,1+Math.random()*2.7,(Math.random()-.5)*3);
    p.userData.life=.65+Math.random()*.4;
    effects.push(p);
  }
}
function landingEffect(pos,color){
  const mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:.8,side:THREE.DoubleSide});
  const ring=addMesh(new THREE.TorusGeometry(.12,.025,8,32),mat,scene,pos.x,.43,pos.z);
  ring.rotation.x=Math.PI/2;
  ring.userData.life=.48;
  ring.userData.ring=true;
  effects.push(ring);
}

function updateCheckmateIcon(){
  if(checkmateSprite){
    scene.remove(checkmateSprite);
    if(checkmateSprite.material.map)checkmateSprite.material.map.dispose();
    checkmateSprite.material.dispose();
    checkmateSprite=null;
  }
  if(!chess.in_checkmate())return;

  const board=chess.board();
  let kingSq=null;
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){
    const p=board[r][f];
    if(p&&p.type==='k'&&p.color==='b')kingSq=String.fromCharCode(97+f)+(8-r);
  }
  if(!kingSq)return;

  const canvas=document.createElement('canvas');
  canvas.width=256;canvas.height=256;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,256,256);
  ctx.font='190px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('😭',128,133);

  const texture=new THREE.CanvasTexture(canvas);
  const material=new THREE.SpriteMaterial({map:texture,transparent:true,depthTest:false});
  checkmateSprite=new THREE.Sprite(material);
  const pos=squarePos(kingSq);
  checkmateSprite.position.set(pos.x,2.8,pos.z);
  checkmateSprite.scale.set(.9,.9,1);
  scene.add(checkmateSprite);
}

function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function updateHistory(){
  const h=chess.history();
  if(!h.length){historyEl.textContent='Belum ada langkah.';return;}
  let html='';
  for(let i=0;i<h.length;i+=2){
    html+='<div class="move"><span>'+(Math.floor(i/2)+1)+'.</span><span>'+escapeHTML(h[i])+'</span><span>'+escapeHTML(h[i+1]||'')+'</span></div>';
  }
  historyEl.innerHTML=html;
  historyEl.scrollTop=historyEl.scrollHeight;
}
function updateStatus(){
  let message;
  if(chess.in_checkmate())message=chess.turn()==='w'?'Skakmat! AI menang.':'Skakmat! Kamu menang!';
  else if(chess.in_draw())message='Permainan seri.';
  else if(chess.in_check())message=chess.turn()==='w'?'Raja putih sedang skak!':'Raja hitam sedang skak!';
  else message=chess.turn()==='w'?'Giliran kamu · Putih (emas)':'AI sedang berpikir · Hitam';
  statusEl.textContent=message;
  topStatus.textContent=message;
  updateCheckmateIcon();
}

function animateMove(from,to,mover,captured,color){
  const start=squarePos(from),end=squarePos(to);
  if(captured){
    const cp=squarePos(to);
    captureEffect(cp,captured.userData.color==='w'?0xe4b347:0x647080);
    boardRoot.remove(captured);
  }
  pieceMeshes.delete(from);
  pieceMeshes.set(to,mover);
  mover.userData.square=to;
  animations.push({obj:mover,start,end,time:performance.now(),duration:420,arch:.72,
    done:()=>landingEffect(end,color==='w'?0xffd36b:0x94a7c4)});
}
function movePiece(from,to){
  if(busy||chess.game_over())return false;
  const legal=chess.moves({square:from,verbose:true}).find(m=>m.to===to);
  if(!legal)return false;
  const mover=pieceMeshes.get(from),captured=pieceMeshes.get(to),color=chess.turn();
  const result=chess.move({from,to,promotion:'q'});
  if(!result)return false;
  busy=true;selected=null;targets=[];
  showLastMove(from,to);
  animateMove(from,to,mover,captured,color);
  updateHistory();updateStatus();
  setTimeout(()=>{
    busy=false;updateStatus();
    if(chess.turn()==='b'&&!chess.game_over())scheduleAI();
  },450);
  return true;
}

const values={p:100,n:320,b:335,r:500,q:900,k:20000};
function evaluate(){
  const b=chess.board();let score=0;
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){
    const p=b[r][f];if(!p)continue;
    let v=values[p.type];
    if(p.type!=='k')v+=(3.5-(Math.abs(f-3.5)+Math.abs(r-3.5))*.35)*7;
    score+=p.color==='b'?v:-v;
  }
  return score;
}
function minimax(depth,alpha,beta,maximizing){
  if(depth===0||chess.game_over()){
    if(chess.in_checkmate())return chess.turn()==='b'?-99999:99999;
    return evaluate();
  }
  const moves=chess.moves({verbose:true});
  moves.sort((a,b)=>(b.captured?values[b.captured]:0)-(a.captured?values[a.captured]:0));
  if(maximizing){
    let best=-Infinity;
    for(const m of moves){
      chess.move(m);const v=minimax(depth-1,alpha,beta,false);chess.undo();
      best=Math.max(best,v);alpha=Math.max(alpha,v);if(beta<=alpha)break;
    }
    return best;
  }else{
    let best=Infinity;
    for(const m of moves){
      chess.move(m);const v=minimax(depth-1,alpha,beta,true);chess.undo();
      best=Math.min(best,v);beta=Math.min(beta,v);if(beta<=alpha)break;
    }
    return best;
  }
}
function chooseAI(level){
  const moves=chess.moves({verbose:true});
  if(!moves.length)return null;
  if(level===1)return moves[Math.floor(Math.random()*moves.length)];
  let best=-Infinity,bestMoves=[];
  const depth=level===2?1:2;
  for(const m of moves){
    chess.move(m);
    const score=minimax(depth,-Infinity,Infinity,false);
    chess.undo();
    const adjusted=score+Math.random()*(level===2?30:4);
    if(adjusted>best){best=adjusted;bestMoves=[m];}
    else if(Math.abs(adjusted-best)<.01)bestMoves.push(m);
  }
  return bestMoves[Math.floor(Math.random()*bestMoves.length)]||moves[0];
}
function scheduleAI(){
  if(aiTimer)clearTimeout(aiTimer);
  aiTimer=setTimeout(()=>{
    if(chess.game_over()||chess.turn()!=='b')return;
    const m=chooseAI(Number(document.getElementById('difficulty').value));
    if(m)movePiece(m.from,m.to);
  },380);
}

function newGame(){
  if(aiTimer)clearTimeout(aiTimer);
  chess.reset();busy=false;selected=null;targets=[];
  animations.length=0;clearEffects();clearMarkers();
  makePieceMap();updateHistory();updateStatus();
}
function undoMove(){
  if(busy)return;
  if(aiTimer)clearTimeout(aiTimer);
  if(!chess.history().length)return;
  chess.undo();
  if(chess.turn()==='b'&&chess.history().length)chess.undo();
  selected=null;targets=[];busy=false;
  clearMarkers();clearEffects();
  makePieceMap();updateHistory();updateStatus();
}
function resetCamera(){
  camera.position.set(7.8,9.7,10.2);
  controls.target.set(0,.25,0);
  controls.update();
}
function rotateBoard(){
  flipped=!flipped;selected=null;targets=[];
  clearMarkers();makePieceMap();resetCamera();
}

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

function handleClick(event){
  if(busy||chess.game_over()||chess.turn()!=='w')return;
  const rect=renderer.domElement.getBoundingClientRect();
  pointer.x=((event.clientX-rect.left)/rect.width)*2-1;
  pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(pointer,camera);

  const clickable=[...squareMeshes.values()];
  pieceMeshes.forEach(obj=>obj.traverse(child=>{if(child.isMesh)clickable.push(child);}));
  const hits=raycaster.intersectObjects(clickable,false);
  if(!hits.length)return;

  let sq=null;
  for(const hit of hits){
    let o=hit.object;
    while(o&&!o.userData.square)o=o.parent;
    if(o&&o.userData.square){sq=o.userData.square;break;}
  }
  if(!sq)return;
  const p=chess.get(sq);
  if(selected){
    if(targets.includes(sq)){movePiece(selected,sq);return;}
    if(p&&p.color==='w'){selectSquare(sq);return;}
    selected=null;targets=[];showSelection();return;
  }
  if(p&&p.color==='w')selectSquare(sq);
}
function selectSquare(sq){
  selected=sq;
  targets=chess.moves({square:sq,verbose:true}).map(m=>m.to);
  showSelection();
}

makeBoard();
makePieceMap();
updateHistory();
updateStatus();

renderer.domElement.addEventListener('pointerdown',handleClick);
document.getElementById('newGame').addEventListener('click',newGame);
document.getElementById('undo').addEventListener('click',undoMove);
document.getElementById('resetCamera').addEventListener('click',resetCamera);
document.getElementById('rotateBoard').addEventListener('click',rotateBoard);
document.getElementById('clearSelection').addEventListener('click',()=>{
  selected=null;targets=[];showSelection();
});

function resize(){
  const w=host.clientWidth,h=host.clientHeight;
  if(!w||!h)return;
  camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);
}
window.addEventListener('resize',resize);

const clock=new THREE.Clock();
function render(){
  requestAnimationFrame(render);
  const dt=Math.min(clock.getDelta(),.04),now=performance.now();

  for(let i=animations.length-1;i>=0;i--){
    const a=animations[i],t=Math.min(1,(now-a.time)/a.duration);
    const sm=t*t*(3-2*t);
    a.obj.position.x=THREE.MathUtils.lerp(a.start.x,a.end.x,sm);
    a.obj.position.z=THREE.MathUtils.lerp(a.start.z,a.end.z,sm);
    a.obj.position.y=THREE.MathUtils.lerp(a.start.y,a.end.y,sm)+Math.sin(t*Math.PI)*a.arch;
    a.obj.rotation.y=Math.sin(t*Math.PI)*.12;
    if(t>=1){
      a.obj.rotation.y=0;a.obj.position.copy(a.end);a.done();animations.splice(i,1);
    }
  }

  haloMeshes.forEach((h,i)=>{
    h.rotation.y+=dt*(i%2?-1.1:1.1);
    h.rotation.z=Math.sin(now*.0015)*.08;
  });

  for(let i=effects.length-1;i>=0;i--){
    const p=effects[i];
    if(p.userData.ring){
      p.userData.life-=dt;
      const progress=Math.max(0,1-p.userData.life/.48);
      p.scale.setScalar(1+progress*4);
      p.material.opacity=Math.max(0,.8*(1-progress));
      if(p.userData.life<=0){scene.remove(p);p.material.dispose();effects.splice(i,1);}
      continue;
    }
    p.userData.life-=dt;
    p.userData.velocity.y-=4.5*dt;
    p.position.addScaledVector(p.userData.velocity,dt);
    p.rotation.x+=dt*4;p.rotation.y+=dt*5;
    p.material.transparent=true;
    p.material.opacity=Math.max(0,p.userData.life);
    if(p.userData.life<=0){scene.remove(p);p.geometry.dispose();p.material.dispose();effects.splice(i,1);}
  }

  controls.update();
  renderer.render(scene,camera);
}

loadingEl.style.display='none';
resize();
render();
})();
</script>
